<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" role="img" aria-label="Yang umum lihat cuma kelurahan dan jaraknya.">
  <!-- Kartu sorotan Cari Ruang. Dihasilkan `skrip/buat-promo.py` — jangan
       disunting langsung; ubah skripnya lalu jalankan ulang, supaya keempat
       kartu tidak pernah berbeda ukuran atau margin. -->
  <defs>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a1512" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="880" height="660" rx="32" fill="#8a2e17"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="64" y="96" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.4"><tspan x="64" dy="0">Alamatmu nggak</tspan><tspan x="64" dy="62">langsung disebar.</tspan></text>
    <text x="64" y="204" font-size="22" fill="#e8bcae">Yang umum lihat cuma kelurahan dan jaraknya.</text>
  </g>

  <g><g filter="url(#bayang)">
      <rect x="64" y="290" width="240" height="190" rx="22" fill="#ffffff"/>
      <circle cx="98" cy="330" r="17" fill="#a93b20"/>
      <text x="98" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19"
            font-weight="800" fill="#ffffff">1</text>
      <text x="126" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1a1512">Semua orang</text>
      <text x="92" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1a1512"><tspan x="92" dy="0">Kelurahan &amp;</tspan><tspan x="92" dy="28">jarak persis</tspan></text>
    </g><g>
      <rect x="320" y="290" width="240" height="190" rx="22" fill="#a35a45"/>
      <circle cx="354" cy="330" r="17" fill="#c98a76"/>
      <text x="354" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19"
            font-weight="800" fill="#ffffff">2</text>
      <text x="382" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f0cdc2">Setelah deal</text>
      <text x="348" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#f0cdc2"><tspan x="348" dy="0">Alamat lengkap</tspan></text>
    </g><g>
      <rect x="576" y="290" width="240" height="190" rx="22" fill="#a35a45"/>
      <circle cx="610" cy="330" r="17" fill="#c98a76"/>
      <text x="610" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19"
            font-weight="800" fill="#ffffff">3</text>
      <text x="638" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f0cdc2">Setelah bayar</text>
      <text x="604" y="392" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#f0cdc2"><tspan x="604" dy="0">Nomor kontak</tspan></text>
    </g></g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <g transform="translate(64 572) scale(0.53125)">
    <rect width="64" height="64" rx="14.1" fill="#ffffff"/>
    <path fill="#8a2e17" d="M19.8 16 H44.2 L51 30.3
      A6.33 4.85 0 0 1 38.33 30.3 A6.33 4.85 0 0 1 25.67 30.3
      A6.33 4.85 0 0 1 13 30.3 Z"/>
    <rect x="10.9" y="43" width="42.2" height="3.8" fill="#8a2e17"/>
  </g>
    <text x="110" y="596" font-size="21" font-weight="700" fill="#ffffff">Cari Ruang</text>
    <text x="242" y="596" font-size="18" fill="#e8bcae">· lahan nganggur jadi cuan</text>
  </g>
</svg>
