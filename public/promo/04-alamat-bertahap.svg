      <text x="350" y="279" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">Setelah deal</text>
      <text x="318" y="324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#64748b"><tspan x="318" dy="0">Alamat lengkap</tspan><tspan x="318" dy="26">dan patokannya</tspan></text>
    </g><g>
      <rect x="532" y="238" width="212" height="160" rx="16" fill="#ffffff" stroke="#dde3ec" stroke-width="2"/>
