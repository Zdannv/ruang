      <text x="80" y="324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#64748b"><tspan x="80" dy="0">Kelurahan, kecamatan,</tspan><tspan x="80" dy="26">jarak persis</tspan></text>
    </g><g>
      <rect x="294" y="238" width="212" height="160" rx="16" fill="#ffffff" stroke="#dde3ec" stroke-width="2"/>
