<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" role="img" aria-label="Disewakan bulanan ke pedagang di sekitarmu.">
  <!-- Kartu sorotan Cari Ruang. Dihasilkan `skrip/buat-promo.py` — jangan
       disunting langsung; ubah skripnya lalu jalankan ulang, supaya keempat
       kartu tidak pernah berbeda ukuran atau margin. -->
  <defs>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a1512" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="880" height="660" rx="32" fill="#a93b20"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="64" y="96" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.4"><tspan x="64" dy="0">Halaman depan nganggur?</tspan><tspan x="64" dy="62">Jadikan cuan.</tspan></text>
    <text x="64" y="204" font-size="22" fill="#f0cdc2">Disewakan bulanan ke pedagang di sekitarmu.</text>
  </g>

  <g>
    <g filter="url(#bayang)">
      <rect x="64" y="272" width="330" height="196" rx="22" fill="#ffffff" opacity="0.22"/>
      <rect x="80" y="288" width="330" height="196" rx="22" fill="#ffffff"/>
    </g>
    <rect x="116" y="418" width="258" height="10" rx="5" fill="#e3d9d2"/>
    <text x="245" y="360" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#8a807a">2 × 3 meter, nganggur</text>

    <g filter="url(#bayang)">
      <rect x="466" y="288" width="350" height="196" rx="22" fill="#1a1512"/>
    </g>
    <path fill="#d99a2b" d="M596 328 H686 L699 354
      A11.7 9 0 0 1 674 354 A11.7 9 0 0 1 649 354 A11.7 9 0 0 1 624 354 A11.7 9 0 0 1 599 354 Z"/>
    <rect x="524" y="384" width="234" height="9" rx="4.5" fill="#d99a2b"/>
    <text x="641" y="446" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="34"
          font-weight="800" fill="#ffffff">Rp 600rb<tspan font-size="20" font-weight="600" fill="#bdb3ac">/bln</tspan></text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <g transform="translate(64 572) scale(0.53125)">
    <rect width="64" height="64" rx="14.1" fill="#ffffff"/>
    <path fill="#a93b20" d="M19.8 16 H44.2 L51 30.3
      A6.33 4.85 0 0 1 38.33 30.3 A6.33 4.85 0 0 1 25.67 30.3
      A6.33 4.85 0 0 1 13 30.3 Z"/>
    <rect x="10.9" y="43" width="42.2" height="3.8" fill="#a93b20"/>
  </g>
    <text x="110" y="596" font-size="21" font-weight="700" fill="#ffffff">Cari Ruang</text>
    <text x="242" y="596" font-size="18" fill="#f0cdc2">· lahan nganggur jadi cuan</text>
  </g>
</svg>
