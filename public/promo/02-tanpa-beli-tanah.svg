<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" role="img" aria-label="Berhenti kapan saja. Nggak ada kontrak setahun.">
  <!-- Kartu sorotan Cari Ruang. Dihasilkan `skrip/buat-promo.py` — jangan
       disunting langsung; ubah skripnya lalu jalankan ulang, supaya keempat
       kartu tidak pernah berbeda ukuran atau margin. -->
  <defs>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a1512" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="880" height="660" rx="32" fill="#1a1512"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="64" y="96" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.4"><tspan x="64" dy="0">Sewa, bukan beli.</tspan></text>
    <text x="64" y="142" font-size="22" fill="#8a807a">Berhenti kapan saja. Nggak ada kontrak setahun.</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="64" y="252" font-size="21" fill="#8a807a">punya lahan sendiri</text>
    <text x="64" y="302" font-size="40" font-weight="800" fill="#6b625c">ratusan juta</text>
    <line x1="60" y1="288" x2="260" y2="288" stroke="#6b625c" stroke-width="4"/>

    <g filter="url(#bayang)">
      <rect x="64" y="352" width="520" height="156" rx="22" fill="#a93b20"/>
    </g>
    <text x="100" y="400" font-size="21" fill="#f0cdc2">sewa 2 × 3 meter di depan rumah orang</text>
    <text x="100" y="464" font-size="46" font-weight="800" fill="#ffffff">ratusan ribu<tspan font-size="22" font-weight="600" fill="#f0cdc2">/bln</tspan></text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <g transform="translate(64 572) scale(0.53125)">
    <rect width="64" height="64" rx="14.1" fill="#a93b20"/>
    <path fill="#ffffff" d="M19.8 16 H44.2 L51 30.3
      A6.33 4.85 0 0 1 38.33 30.3 A6.33 4.85 0 0 1 25.67 30.3
      A6.33 4.85 0 0 1 13 30.3 Z"/>
    <rect x="10.9" y="43" width="42.2" height="3.8" fill="#ffffff"/>
  </g>
    <text x="110" y="596" font-size="21" font-weight="700" fill="#ffffff">Cari Ruang</text>
    <text x="242" y="596" font-size="18" fill="#8a807a">· lahan nganggur jadi cuan</text>
  </g>
</svg>
