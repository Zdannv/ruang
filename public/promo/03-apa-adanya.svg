    <rect x="10.9" y="43" width="42.2" height="3.8" fill="#ffffff"/>
  </g>
    <text x="110" y="596" font-size="21" font-weight="700" fill="#1a1512">Cari Ruang</text>
    <text x="242" y="596" font-size="18" fill="#6b625c">· lahan nganggur jadi cuan</text>
