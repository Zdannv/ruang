<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" role="img" aria-label="16 hal wajib diisi pemilik — termasuk yang jelek.">
  <!-- Kartu sorotan Cari Ruang. Dihasilkan `skrip/buat-promo.py` — jangan
       disunting langsung; ubah skripnya lalu jalankan ulang, supaya keempat
       kartu tidak pernah berbeda ukuran atau margin. -->
  <defs>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a1512" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="880" height="660" rx="32" fill="#f6ead9"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="64" y="96" font-size="52" font-weight="800" fill="#1a1512" letter-spacing="-1.4"><tspan x="64" dy="0">Tahu kondisinya</tspan><tspan x="64" dy="62">sebelum berangkat.</tspan></text>
    <text x="64" y="204" font-size="22" fill="#6b625c">16 hal wajib diisi pemilik — termasuk yang jelek.</text>
  </g>

  <g><g>
      <rect x="64" y="288" width="752" height="60" rx="16" fill="#ffffff"/>
      <circle cx="98" cy="318" r="16" fill="#dcf5e6"/>
      <path transform="translate(98 318)" d="M-6 0 l5 5 l9 -10" stroke="#067647" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="132" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" fill="#1a1512">Muka jalan 3 m · muat gerobak</text>
    </g><g>
      <rect x="64" y="360" width="752" height="60" rx="16" fill="#ffffff"/>
      <circle cx="98" cy="390" r="16" fill="#dcf5e6"/>
      <path transform="translate(98 390)" d="M-6 0 l5 5 l9 -10" stroke="#067647" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="132" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" fill="#1a1512">Jendela akses Senin–Sabtu, 06.00–21.00</text>
    </g><g>
      <rect x="64" y="432" width="752" height="60" rx="16" fill="#ffffff"/>
      <circle cx="98" cy="462" r="16" fill="#fbe6cd"/>
      <path transform="translate(98 462)" d="M0 -7 v8 M0 5 v1.5" stroke="#b54708" stroke-width="3"
