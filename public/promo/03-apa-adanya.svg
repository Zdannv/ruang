      <text x="132" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" fill="#1a1512">Pernah banjir dalam 5 tahun terakhir</text>
    </g></g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <g transform="translate(64 572) scale(0.53125)">
    <rect width="64" height="64" rx="14.1" fill="#a93b20"/>
    <path fill="#ffffff" d="M19.8 16 H44.2 L51 30.3
