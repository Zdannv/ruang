<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f5fff" />
    <title>Tidak ada koneksi — Ruang</title>
    <!--
      Halaman ini sengaja berkas statis biasa, bukan rute Next.

      Rute Next akan ikut merender layout aplikasi, yang membaca sesi dan
      menampilkan nama orang yang sedang masuk. Halaman itu lalu disimpan
      service worker dan bisa muncul lagi untuk siapa pun yang membuka
      peramban ini nanti. Halaman offline tidak boleh memuat data siapa pun.
    -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eef2f9;
        color: #0f1729;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 1.5rem;
      }
      .kartu {
        max-width: 24rem;
        background: #fff;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 1px 2px rgb(15 23 41 / 0.06);
        text-align: center;
      }
      .lambang {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.25rem;
        display: block;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
      p { font-size: 0.875rem; line-height: 1.6; color: #64748b; margin: 0 0 1.5rem; }
      button {
        border: 0;
        border-radius: 999px;
        background: #1f5fff;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        cursor: pointer;
      }
      button:hover { background: #1747cc; }
    </style>
  </head>
  <body>
    <div class="kartu">
      <img class="lambang" src="/icon-192.png" alt="" />
      <h1>Tidak ada koneksi</h1>
      <p>
        Ruang butuh koneksi untuk menampilkan ruang, pemesanan, dan jadwal kunjungan —
        semuanya data yang berubah dan tidak disimpan di perangkat ini.
      </p>
      <button onclick="location.reload()">Coba lagi</button>
    </div>
  </body>
</html>
